layout_generation:
  layout_model_config: layout_gen/models/cldm_v21.yaml
  height_model_config: layout_gen/models/cldm_v21_height.yaml
  layout_checkpoint: /dev/shm/worldbridge_majutsucity_l40s/MajutsuCity/MajutsuCity/layout/layout_generation.ckpt
